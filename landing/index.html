<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Tracker</title>
<meta name="description" content="Ask your watch what it knows. A Pixel Watch app, a dashboard and Claude, working on your own data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14.7' fill='%2324306a'/%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23fff' stroke-width='3.2'/%3E%3Cpath d='M22.25 15.11A19.5 19.5 0 0 1 50.84 37.05' fill='none' stroke='%23b6c2ff' stroke-width='6.5' stroke-linecap='round'/%3E%3Cpath d='M17 37h8.7l1.8-2.2 1.8 2.2h1.2l.9 2.42 1.5-13.42 1.65 16.28L35.9 37h3.3l2.4-2.64L44 37h3' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: la pregunta primero (portada con la conversación), después el día en la esfera fija con el scroll,
   lo que descubre, el dashboard, la privacidad y la firma. Tokens del dashboard; esfera fiel al reloj. */
:root {
  color-scheme: dark;
  --bg: #0f1116; --surface: #1a1d24; --surface-2: #242833; --ink: #e7e9f0; --muted: #a2a8b8;
  --line: #2f343f; --line-strong: #7d8496; --primary: #b6c2ff; --on-primary: #141c45; --container: #2a3363; --on-container: #e1e5f5;
  --band: #232a3e; --drop: rgb(0 0 0 / .55); --glow: rgb(84 112 214 / .2);
  --m-hr: #ee6a5f; --m-hrv: #f48bc0; --m-deep: #5470d6; --m-rem: #8ea9ff; --m-light: #d0dbff; --m-awake: #f0a650;
  --m-steps: #5ccf97; --m-caffeine: #f2c46b; --m-cig: #dfe3ea; --m-alcohol: #b48ae8; --m-water: #38b6ff; --m-supp: #f59bb8;
  --ok: #5ccf97; --ok-container: #163829; --probable: #f2b65e; --probable-container: #3b2a12; --key: #f2c46b;
  --font-sans: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Red Hat Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius-sm: 6px; --radius-md: 12px; --radius-lg: 20px; --radius-full: 999px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --wrap: 1180px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f3f4f6; --surface: #ffffff; --surface-2: #eceef3; --ink: #12172b; --muted: #545b6e;
    --line: #dadde4; --line-strong: #767d90; --primary: #24306a; --on-primary: #ffffff; --container: #e1e5f5; --on-container: #141c45;
    --band: #e6e9f4; --drop: rgb(18 23 43 / .22); --glow: transparent;
    --m-hr: #b3261e; --m-hrv: #c2367e; --m-deep: #1d3b8f; --m-rem: #3e6fe0; --m-light: #6587da; --m-awake: #a15c00;
    --m-steps: #188a5b; --m-caffeine: #9a6a00; --m-cig: #4a5260; --m-alcohol: #8a3fb0; --m-water: #0a6fae; --m-supp: #a8346a;
    --ok: #146c47; --ok-container: #dff3e9; --probable: #8a4b00; --probable-container: #fbebd6; --key: #8a4b00;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #eceef3; --ink: #12172b; --muted: #545b6e;
  --line: #dadde4; --line-strong: #767d90; --primary: #24306a; --on-primary: #ffffff; --container: #e1e5f5; --on-container: #141c45;
  --band: #e6e9f4; --drop: rgb(18 23 43 / .22); --glow: transparent;
  --m-hr: #b3261e; --m-hrv: #c2367e; --m-deep: #1d3b8f; --m-rem: #3e6fe0; --m-light: #6587da; --m-awake: #a15c00;
  --m-steps: #188a5b; --m-caffeine: #9a6a00; --m-cig: #4a5260; --m-alcohol: #8a3fb0; --m-water: #0a6fae; --m-supp: #a8346a;
  --ok: #146c47; --ok-container: #dff3e9; --probable: #8a4b00; --probable-container: #fbebd6; --key: #8a4b00;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-sans); font-size: 17px; line-height: 1.55; font-weight: 400;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-weight: 600; line-height: 1.08; text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: var(--radius-sm); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--wrap); margin-inline: auto; }
.sample {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); justify-self: start; width: fit-content;
  border: 1px dashed var(--line-strong); border-radius: var(--radius-full); padding: 2px 10px;
}

/* Cabecera */
.top { display: flex; align-items: center; gap: 16px; padding-block: 16px; }
.lang {
  display: grid; place-items: center; min-width: 40px; min-height: 32px; padding: 0 8px; margin-left: 10px; border: 1px solid var(--line); border-radius: var(--radius-full);
  background: none; color: var(--muted); cursor: pointer; font: 500 12px/1 var(--font-sans); letter-spacing: .06em;
}
.lang:hover { color: var(--ink); border-color: var(--line-strong); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; text-decoration: none; }
.brand svg { width: 30px; height: 30px; }
.top nav { display: flex; gap: 22px; font-size: 15px; color: var(--muted); margin-left: auto; }
.top nav a { text-decoration: none; }
.top nav a:hover { color: var(--ink); }
.social { display: flex; gap: 6px; font-size: 15px; }
.social a, .contact a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); min-height: 44px; padding-inline: 8px; border-radius: var(--radius-full); }
.social a:hover, .contact a:hover { color: var(--primary); }
.social svg, .contact svg { width: 18px; height: 18px; flex: none; }

/* Portada */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; padding-block: 40px 96px; }
.hero-txt { display: grid; gap: 22px; align-content: center; }
.hero h1 { font-size: clamp(44px, 6vw, 84px); letter-spacing: -0.035em; }
.hero .sub { font-size: clamp(19px, 1.6vw, 22px); color: var(--muted); max-width: 26em; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills span { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; padding: 6px 14px 6px 8px; border-radius: var(--radius-full); background: var(--surface-2); }
.pills svg { width: 20px; height: 20px; }
.go { display: inline-flex; align-items: center; gap: 10px; justify-self: start; min-height: 48px; padding: 12px 22px; border-radius: var(--radius-full); background: var(--primary); color: var(--on-primary); font-weight: 600; text-decoration: none; }
.go:hover { filter: brightness(1.08); }
.go svg { width: 18px; height: 18px; }

/* Conversación */
.chat { display: grid; gap: 18px; min-width: 0; }
.msg { display: grid; gap: 6px; max-width: 94%; min-width: 0; }
.msg.you { justify-self: end; }
.msg.you .bubble { background: var(--container); color: var(--on-container); border-radius: 18px 18px 4px 18px; padding: 12px 18px; font-size: 18px; }
.msg.ai { justify-self: start; }
.msg .who { font-size: 13px; color: var(--muted); }
.msg.you .who { justify-self: end; }
.msg.ai .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 18px 20px; display: grid; gap: 12px; font-size: 17px; }
.msg.ai .bubble svg { width: 100%; max-width: 520px; height: auto; display: block; }
.msg .bubble em { font-style: normal; color: var(--muted); font-size: 14px; }
.msg mark { background: none; color: var(--key); font-weight: 600; }
.typing [data-type] .w { opacity: 0; transition: opacity 160ms linear; }
.typing [data-type] .w.in { opacity: 1; }

/* El día */
.day { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 0 48px; }
.stage {
  grid-column: 2; grid-row: 1; position: sticky; top: env(safe-area-inset-top, 0px);
  height: 100vh; height: 100svh; display: grid; place-items: center; align-content: center; gap: 20px;
}
.scenes { grid-column: 1; grid-row: 1; padding-bottom: 40vh; }
.watch {
  --size: min(500px, 40vw, 70svh);
  width: var(--size); aspect-ratio: 1; max-width: 100%; border-radius: 50%; position: relative; background: #000;
  box-shadow: 0 0 0 calc(var(--size) * .035) #202329, 0 0 0 calc(var(--size) * .043) #3a3e47,
              0 28px 60px -24px var(--drop), 0 0 110px 8px var(--glow);
}
.watch svg { width: 100%; height: 100%; display: block; border-radius: 50%; overflow: hidden; }
.readout { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; min-height: 44px; }
.clock { display: flex; align-items: baseline; gap: 10px; color: var(--muted); font-size: 14px; white-space: nowrap; }
.clock b { font-family: var(--font-mono); font-weight: 500; font-size: 28px; color: var(--ink); font-variant-numeric: tabular-nums; }
.callout { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 14px 4px 6px; border-radius: var(--radius-full); background: var(--surface); border: 1px solid var(--line); font-size: 15px; font-weight: 500; white-space: nowrap; transition: opacity 200ms var(--ease); }
.callout[data-empty] { opacity: 0; }
.callout .g { width: 26px; height: 26px; border-radius: 50%; background: #000; display: grid; place-items: center; }
.callout .g svg { width: 20px; height: 20px; }

.scene { min-height: 90vh; min-height: 90svh; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding-block: 8vh; max-width: 30em; }
.scene .when { font-family: var(--font-mono); font-size: 15px; color: var(--primary); font-variant-numeric: tabular-nums; }
.scene h2 { font-size: clamp(30px, 3.6vw, 46px); }
.scene p { color: var(--muted); font-size: 19px; max-width: 28em; }
.intro h2 { font-size: clamp(38px, 4.8vw, 62px); }
.vignette { display: none; }

/* Marcas del reloj */
.mk { transform-box: fill-box; transform-origin: center; transform: scale(0); transition: transform 320ms var(--ease); }
.on > .mk { transform: scale(1); }
.hl { opacity: 0; transition: opacity 200ms linear; }
.hl.on { opacity: 1; }
.tick { opacity: 0; transition: opacity 240ms linear; }
.tick.on { opacity: .7; }
.ov { opacity: 0; transition: opacity 220ms var(--ease); pointer-events: none; }
.ov.on { opacity: 1; }

/* Bloques */
.block { padding-block: 120px 40px; }
.block > header { display: grid; gap: 16px; max-width: 40em; margin-bottom: 44px; }
.block h2 { font-size: clamp(34px, 4.4vw, 58px); }
.block .lead { font-size: 20px; color: var(--muted); max-width: 34em; }
.sub-h { font-size: clamp(26px, 3vw, 36px); margin: 88px 0 28px; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 24px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card.feature { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px 40px; padding: 32px; align-items: center; }
.card.feature .txt { display: grid; gap: 14px; align-content: start; }
.card.feature .say { font-size: clamp(24px, 2.6vw, 32px); }
.card h3 { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.card .say { font-size: 20px; line-height: 1.3; font-weight: 500; text-wrap: balance; }
.card svg.chart { width: 100%; height: auto; display: block; }
.card .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); flex-wrap: wrap; margin-top: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; border-radius: var(--radius-full); padding: 3px 10px; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.probable { color: var(--probable); background: var(--probable-container); }
.chip.solido { color: var(--ok); background: var(--ok-container); }
.chain { display: grid; gap: 6px; justify-items: start; }
.chain .node { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: var(--radius-full); padding: 5px 14px 5px 5px; font-size: 15px; }
.chain .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.chain .dot svg { width: 22px; height: 22px; }
.chain .arrow { color: var(--line-strong); padding-left: 14px; line-height: 1; }
.factors { display: grid; gap: 10px; font-size: 16px; }
.factors div { display: flex; align-items: center; gap: 10px; }
.factors svg { width: 22px; height: 22px; flex: none; background: #000; border-radius: 50%; padding: 2px; }
.more { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; align-items: start; }
.honest { margin-top: 32px; font-size: 15px; color: var(--muted); max-width: 42em; border-left: 2px solid var(--line-strong); padding-left: 14px; }

/* Dashboard */
.dash { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); }
.tabs button {
  font: inherit; font-size: 15px; font-weight: 500; color: var(--muted); background: none; border: 0; cursor: pointer;
  padding: 10px 16px; border-radius: var(--radius-full); min-height: 44px; white-space: nowrap;
}
.tabs button:hover { color: var(--ink); background: var(--surface-2); }
.tabs button[aria-selected="true"] { background: var(--container); color: var(--on-container); }
.panel { padding: 24px 28px 28px; }
.panel .cap { color: var(--muted); margin-bottom: 18px; max-width: 68ch; }
.panel .cap strong { color: var(--ink); font-weight: 600; }
.shots { position: relative; padding: 0 12% 6% 0; }
.shots img { display: block; width: 100%; height: auto; border: 1px solid var(--line); background: var(--surface-2); }
.shot-d { border-radius: 14px; }
.shot-m { position: absolute; right: 0; bottom: 0; width: 22% !important; border-radius: 22px; box-shadow: 0 18px 40px -12px rgb(0 0 0 / .45); }
.dash-note { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: 14px; color: var(--muted); }

/* Tuyo */
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.three div { display: grid; gap: 10px; align-content: start; }
.three svg { width: 36px; height: 36px; }
.three h3 { font-size: 22px; }
.three p { color: var(--muted); }

/* Cierre y firma */
.end { padding-block: 140px 80px; display: grid; justify-items: center; text-align: center; gap: 22px; }
.end .watch { --size: min(240px, 60vw); }
.end h2 { font-size: clamp(34px, 4.4vw, 58px); }
.end p { color: var(--muted); max-width: 32em; font-size: 19px; }
footer.author { display: flex; gap: 24px; align-items: center; padding-block: 48px; border-top: 1px solid var(--line); }
footer.author img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--line-strong); }
.who-txt { display: grid; gap: 10px; min-width: 0; }
.who-txt h2 { font-size: 26px; }
.who-txt p { color: var(--muted); font-size: 18px; max-width: 36em; }
.contact { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 15px; margin-left: -8px; }
.contact .mail { user-select: all; padding-inline: 8px; }
.fine { padding-block: 22px 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (prefers-reduced-motion: no-preference) {
  @supports (animation-timeline: view()) {
    .reveal { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 70%; }
    @keyframes rise { from { opacity: .15; transform: translateY(36px) scale(.98); } to { opacity: 1; transform: none; } }
  }
}

/* Móvil */
@media (max-width: 860px) {
  body { font-size: 16px; }
  .top nav, .social span { display: none; }
  .social { margin-left: auto; }
  .social a { min-width: 44px; justify-content: center; }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 36px; padding-block: 12px 64px; }
  .day { grid-template-columns: minmax(0, 1fr); }
  .stage {
    grid-column: 1; grid-row: 1; height: auto; padding-block: 18px 14px; z-index: 2;
    background: linear-gradient(var(--bg) 88%, transparent); gap: 12px;
  }
  .watch { --size: min(64vw, 34svh); }
  .clock b { font-size: 22px; }
  .scenes { grid-row: 2; padding-bottom: 20svh; }
  .scene { min-height: 62svh; justify-content: flex-start; padding-block: 2svh 10svh; }
  .scene p { font-size: 17px; }
  .cards, .more { grid-template-columns: minmax(0, 1fr); }
  .card.feature { grid-template-columns: minmax(0, 1fr); padding: 24px; }
  .panel { padding: 18px 16px 20px; }
  .shots { padding: 0; }
  .shot-d { display: none !important; }
  .shot-m { position: static; width: min(100%, 320px) !important; margin-inline: auto; box-shadow: none; }
  .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 6px; }
  .tabs button { padding: 10px 2px; font-size: 13.5px; }
  .three { grid-template-columns: minmax(0, 1fr); }
  .block { padding-block: 90px 24px; }
  .msg { max-width: 100%; }
  footer.author { flex-direction: column; align-items: flex-start; }
}

/* Reducción de movimiento: sin reloj fijo; cada escena lleva su esfera ya pintada */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .day { grid-template-columns: minmax(0, 1fr); }
  .stage { display: none; }
  .vignette { display: block; margin: 8px 0 0; }
  .vignette .watch { --size: min(300px, 70vw); }
  .scene { min-height: 0; padding-block: 40px; max-width: 46em; }
  .scenes { padding-bottom: 0; }
  .mk, .tick, .ov, .hl { transition: none; }
}
@media (prefers-reduced-motion: reduce) and (min-width: 861px) {
  .scene:has(.vignette) { display: grid; grid-template-columns: minmax(0, 1fr) 300px; column-gap: 48px; align-content: center; max-width: 64em; }
  .scene:has(.vignette) > :not(.vignette) { grid-column: 1; }
  .scene > .vignette { grid-column: 2; grid-row: 1 / span 4; align-self: center; }
}
</style>
</head>
<body>

<header class="top wrap">
  <a class="brand" href="#top" aria-label="Health Tracker">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M22.25 15.11A19.5 19.5 0 0 1 50.84 37.05" fill="none" stroke="var(--m-deep)" stroke-width="5" stroke-linecap="round"/><path d="M17.0 37L25.7 37L27.5 34.8L29.3 37L30.5 37L31.4 39.42L32.9 26L34.55 42.28L35.9 37L39.2 37L41.6 34.36L44.0 37L47.0 37" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Health Tracker
  </a>
  <button type="button" class="lang" id="lang-btn"></button>
  <nav data-t-aria="nav.aria">
    <a href="#dia" data-t="nav.day"></a>
    <a href="#descubre" data-t="nav.discover"></a>
    <a href="#tuyo" data-t="nav.privacy"></a>

    current = k;
    panel.innerHTML = `<p class="cap"><strong>${tx('tab.' + k)}.</strong> ${tx('p.' + k)}</p><div class="shots"><img class="shot-d" src="${shot(k, 'd')}" width="1280" height="800" alt="${tx('dash.alt').replace('{0}', tx('tab.' + k))}"><img class="shot-m" src="${shot(k, 'm')}" width="390" height="760" alt="${tx('dash.altm')}"></div>`;
    tabs.forEach(b => { const on = b.id === 'tab-' + k; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
    panel.setAttribute('aria-labelledby', 'tab-' + k);
  };
  matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => show(current));
  tabs.forEach((b, i) => {
    b.addEventListener('click', () => show(b.id.slice(4)));
    b.addEventListener('keydown', e => {
      const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      const n = tabs[(i + d + tabs.length) % tabs.length];
      n.focus(); show(n.id.slice(4));
    });
  });

  // Textos del idioma activo; los gráficos y las pestañas se redibujan con él.
  function apply() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(n => { n.textContent = tx(n.dataset.t); });
    document.querySelectorAll('[data-th]').forEach(n => { n.innerHTML = tx(n.dataset.th); });
    document.querySelectorAll('[data-t-aria]').forEach(n => n.setAttribute('aria-label', tx(n.dataset.tAria)));
    document.querySelectorAll('[data-t-alt]').forEach(n => n.setAttribute('alt', tx(n.dataset.tAlt)));
    document.querySelectorAll('.typing').forEach(b => b.classList.remove('typing'));
    const lb = $('lang-btn'); lb.textContent = tx('lang.btn'); lb.title = tx('lang.title'); lb.setAttribute('aria-label', lb.title);
    charts();
    show(current);
    vignettes.forEach(v => { v.box.setAttribute('aria-label', tx(v.alt)); v.update(v.still); });
    endFace(405);
    frame(true);
  }
  $('lang-btn').addEventListener('click', () => {
    lang = lang === 'es' ? 'en' : 'es';
    try { localStorage.setItem('ht.landing.lang', lang); } catch (e) { /* sin almacenamiento: vale para esta visita */ }
    apply();
  document.fonts?.ready.then(apply);  // remide las diagonales con Outfit ya cargada
  });
  apply();
  document.fonts?.ready.then(apply);  // remide las diagonales con Outfit ya cargada

  // Las respuestas de Claude aparecen palabra a palabra al llegar a ellas; el texto completo ya está en la página.
  if (!reduce && 'IntersectionObserver' in window) {
    const words = p => {
      const out = [];
      const walk = n => [...n.childNodes].forEach(c => {
        if (c.nodeType !== 3) return walk(c);
        const frag = document.createDocumentFragment();
        c.textContent.split(/(\s+)/).forEach(w => {
          if (!w) return;
          if (/^\s+$/.test(w)) return frag.append(w);
          const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w; frag.append(sp); out.push(sp);
        });
        c.replaceWith(frag);
      });
      walk(p);
      return out;
    };
    const play = async bubble => {
      const ws = [...bubble.querySelectorAll('[data-type]')].flatMap(words);
      bubble.classList.add('typing');
      for (const w of ws) { if (!w.isConnected) break; w.classList.add('in'); await new Promise(r => setTimeout(r, 26)); }
      bubble.classList.remove('typing');
    };
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) { io.unobserve(en.target); play(en.target); }
    }), { threshold: .3 });
    document.querySelectorAll('.msg.ai .bubble').forEach(b => io.observe(b));
  }

})();
</script>
