  /* ---- base ---- */

  .top { display: contents; }

  /* ---- Today: dial, metrics, totals and timeline ---- */
  .today { display: grid; align-items: start; gap: 16px; }

  /* range strip: your usual band (p25-p75) with its median, and the day's value as a dot */
  .ht-strip { position: relative; height: 16px; margin-top: 10px; min-width: 64px; }

  .vit-note { font-size: 12px; line-height: 16px; color: var(--muted); padding-bottom: 4px; }

  /* ---- card ---- */
  .ht-card { background: var(--surface); border-radius: var(--radius-md); padding: 16px; min-width: 0; }

  .ht-sync { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px 0 8px; border-radius: var(--radius-full); background: var(--surface-2); color: var(--muted); font-size: 12px; line-height: 16px; font-weight: var(--w-strong); }

    font: 500 13px/16px var(--font-sans); letter-spacing: .04em; color: var(--muted); }
  .ht-lang button[aria-pressed="true"], .sl-seg button[aria-pressed="true"], .hv-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: var(--w-title); }

  /* ---- notices ---- */
  .notice { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 14px 16px; border-radius: var(--radius-md); background: var(--attention-container); color: var(--on-attention-container); margin: 4px 0 16px; }

  /* ---- dial ---- */
  .ht-dial { width: 100%; max-width: min(100%, 340px); margin: 4px auto 0; }

  .ht-dial-legend[hidden] { display: none; }

  .ht-key-other { width: 9px; height: 9px; box-shadow: inset 0 0 0 2px var(--ink); }

  /* ---- pill: only for a value outside your range ---- */
  .ht-pill { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 2px 10px; border-radius: var(--radius-full); font-size: 12px; line-height: 16px; font-weight: var(--w-strong); background: var(--surface-2); color: var(--ink); text-align: center; }
  .ht-pill-out { background: var(--attention-container); color: var(--on-attention-container); }
  .ht-pill svg { width: 14px; height: 14px; }
  .ht-word { font-size: 22px; line-height: 28px; font-weight: var(--w-title); }

  .ht-steps-g { font-size: 13px; line-height: 18px; color: var(--muted); }
  .ht-bar { position: relative; height: 10px; border-radius: var(--radius-full); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-strong); margin: 16px 0 8px; }
  .ht-bar-f { position: absolute; inset: 0 auto 0 0; border-radius: var(--radius-full); background: var(--m-steps); }
  .ht-bar-x { position: absolute; top: -5px; width: 2px; height: 20px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
  .ht-bar-cap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; line-height: 18px; color: var(--muted); }

  /* ---- tracker summary ---- */
  .ht-trk { display: grid; }
  .ht-trk li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 0; min-width: 0; }
  .ht-trk li + li { border-top: 1px solid var(--line); }
  .ht-trk-h { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; }
  .ht-trk-v { grid-column: 2; grid-row: 1 / 3; align-self: center; text-align: right; font-size: 20px; line-height: 26px; font-weight: 500; overflow-wrap: anywhere; }
  .ht-trk-s { font-size: 12px; line-height: 16px; color: var(--muted); padding-left: 28px; }

  /* ---- day timeline: sleep, naps, workouts and logs in order, linked to the dial ---- */
  .tl { display: grid; }

    border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: var(--radius-sm); outline-offset: -2px; transition: background var(--dur-fast) var(--ease-standard); }

  .tl-x { padding: 4px 0 8px; }
  .tl-g { padding: 14px 0 4px; font-size: 12px; line-height: 16px; font-weight: var(--w-strong); color: var(--muted); }
  .tl-m { justify-self: center; margin-top: 4px; }
  .tl-m.tick { width: 3px; height: 14px; border-radius: 2px; background: var(--k, var(--ink)); }
  .tl-m.ring { width: 10px; height: 10px; border-radius: var(--radius-full); box-shadow: inset 0 0 0 2px var(--m-mood); margin-top: 6px; }
  .tl-m.sq { width: 9px; height: 9px; box-shadow: inset 0 0 0 2px var(--ink); margin-top: 6px; }
  .tl-m.dia { width: 8px; height: 8px; transform: rotate(45deg); background: var(--m-cig); margin-top: 7px; }
  .tl-m.tri { width: 10px; height: 10px; background: var(--m-alcohol); clip-path: polygon(50% 0, 100% 100%, 0 100%); margin-top: 6px; }

  @media (max-width: 599px) { .tl-r { grid-template-columns: 10px 62px minmax(0, 1fr) auto; column-gap: 6px; } }
  .tl-r time, .tl-t { font: 500 13px/22px var(--font-mono); }

  .tl-e { display: block; font: 500 12px/16px var(--font-mono); color: var(--muted); }
  .tl-n { display: flex; align-items: center; gap: 6px; min-width: 0; line-height: 22px; overflow-wrap: anywhere; }
