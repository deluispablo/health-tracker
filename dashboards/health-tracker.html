  /* I3 dot strip: pts are the neighbours' outcomes; band the usual range; ends [[value, label], [value, label]]. */

       findings(ctx, { filter, title })                I4; filter(finding) → boolean over the active list (R1.11)

                                                       { fmt, color, H, lo, band, goal, W } or a function (stats, sel) → Element

  try { const observer = new ResizeObserver(fit); [qw, $('wordmark'), document.querySelector('.top-r'), ...document.querySelectorAll('.page-h')].forEach((n) => observer.observe(n)); } catch (e) { /* older engines: the resize listener still runs */ }
  window.addEventListener('resize', fit); fit();

  /* Clock: the header follows the minute; midnight re-subscribes for the new date (the shown tab has its own minute timer, R2.4). */
  setInterval(() => {
    if (stopped) return;
    const n = now();
    if (n.date !== viewDate) return setDate(n.date);
    if (syncDay(n)) return;
    renderHeader();
  }, 30000);

  applyStatic();
  activate(location.hash.slice(1) || 'today');
  render();
  try {
    if (window.claude) {
      const claude = window.claude;
      const mcp = await claude.use("mcp");
      connector = mcp;
    }
  } catch (e) { connector = null; }
  noConnector = !connector;
  if (connector) { SOURCES.forEach(subscribe); syncNow(); }
  /* The goal never blocks the page: on any failure the default stays. */
  if (connector) connector.callTool(SERVER, 'health_profile', {}).then((r) => { GOAL = L.stepGoal(r?.payload); WGOAL = L.waterGoal(r?.payload); if (!stopped) render(); }).catch(() => {});
  render();
})();
</script>
